[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qafiya"
version = "0.2.0"
description = "Provenance-first data model: bindings join every rendered value and claim to its evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Youssef Hariri", email = "youssef.hariri@rennes-sb.com"}]
keywords = ["provenance", "verification", "LLM", "data model", "faithfulness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/DeeWaanAI/qafiya"

[project.optional-dependencies]
pdf = ["pdfplumber"]
docx = ["python-docx"]

[tool.setuptools]
packages = ["qafiya_core"]
package-dir = {"qafiya_core" = "qafiya-core/qafiya_core"}
